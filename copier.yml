
_min_copier_version: "9.10.0"
_subdirectory: template
_answers_file: .copier-cxx-answers.yml

# the project owns these once created
_skip_if_exists:
  - renovate.json

#===============================================================================
# Interactive

# optional project name
project_name_raw:
  type: str
  qmark: "\n >"
  help: "Project Name:"
  placeholder: "\"\""
  default: "{{_folder_name}}"
  when: >-
    {{ not (
         _folder_name.startswith('bench')
         and _folder_name[5:].isdigit()
       ) }}

# optional project description
project_description:
  type: str
  qmark: "\n >"
  help: "Project Description:"
  placeholder: "\"\""
  default: ""
  when: >-
    {{ not (
         _folder_name.startswith('bench')
         and _folder_name[5:].isdigit()
       ) }}

# source language
language:
  qmark: "\n >"
  help: "Language:"
  type: str
  choices:
    - "C"
    - "C++"
  default: "C"

# platforms make release builds for the GitHub release, cross-compiled with zig
release_targets:
  qmark: "\n >"
  help: "Release Targets:"
  type: str
  multiselect: true
  choices:
    - "windows-arm64"
    - "windows-x86"
    - "windows-x64"
    - "linux-arm32"
    - "linux-arm64"
    - "linux-x86"
    - "linux-x64"
    - "macOS-intel"
    - "macOS-apple-silicon"
    - "none"
  default: ["none"]
  validator: >-
    {% if 'none' in release_targets and release_targets | length > 1 %}
    "none" cannot be combined with other targets
    {% endif %}


#===============================================================================
# Defaults
# Saved in ~/.config/copier/settings.yml

user_name:
  when: false

user_email:
  when: false

github_user:
  when: false


#===============================================================================
# Auto-generate

# Capitalised Project Name
project_name:
  default: >-
    {{
      project_name_raw
      | trim
      | title
    }}
  when: false

# kebab-case-project-name
project_slug:
  type: str
  default: >-
    {{
      project_name_raw
      | lower
      | trim
      | regex_replace('[^a-z0-9]+', '-')
      | regex_replace('-+', '-')
      | trim('-')
    }}
  when: false

# snake_case_module_name
module_slug:
  type: str
  default: >-
    {{ project_slug | regex_replace('-', '_') }}
  when: false

# source file extension for the chosen language
source_ext:
  type: str
  default: "{{ 'cpp' if language == 'C++' else 'c' }}"
  when: false

# current year for licenses
year:
  type: int
  default: "{{ '%Y' | strftime }}"
  when: false


#===============================================================================
# Tasks

_tasks:
  - command: 'git init'
    when: "{{ _copier_operation == 'copy' }}"
  - command: 'git branch -M main'
    when: "{{ _copier_operation == 'copy' }}"
  - command: 'git add --all'
    when: "{{ _copier_operation == 'copy' }}"
  - command: 'git commit -m "Copy from generic template" -m "https://github.com/karshosphere/template-cxx"'
    when: "{{ _copier_operation == 'copy' }}"
  - command: 'git remote add origin git@github.com:{{ github_user }}/{{ project_slug }}.git'
    when: "{{ _copier_operation == 'copy' }}"

